# Optional local AI service. No port or cloud provider is exposed.
services:
  ollama:
    image: ollama/ollama:0.40.6
    environment:
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    networks: [audiowhisper]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
  api:
    environment:
      OLLAMA_URL: http://ollama:11434
  worker:
    environment:
      OLLAMA_URL: http://ollama:11434
volumes:
  ollama_data:
