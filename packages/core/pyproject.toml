[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "audiowhisper-core"
version = "0.1.0"
description = "Shared models, schemas and config for AudioWhisper API and worker"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "alembic>=1.13",
    "python-docx==1.2.0",
    "reportlab==5.0.1",
]

[tool.setuptools.packages.find]
where = ["src"]
