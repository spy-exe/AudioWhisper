name: Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/web
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: coverage-web
          path: apps/web/coverage
          retention-days: 14

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            coverage: '--cov=apps/api/app --cov=packages/core/src/audiowhisper_core'
            threshold: 88
          - service: worker
            coverage: '--cov=apps/worker/app'
            threshold: 65
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            apps/${{ matrix.service }}/requirements*.txt
            packages/core/pyproject.toml
      - name: System dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg libmagic1
      - name: Python dependencies
        run: python -m pip install -e packages/core -r apps/${{ matrix.service }}/requirements-dev.txt
      - name: Tests and coverage
        run: >-
          python -m pytest apps/${{ matrix.service }}/tests -c apps/${{ matrix.service }}/pytest.ini
          --basetemp=.devdata/pytest-${{ matrix.service }}
          ${{ matrix.coverage }} --cov-fail-under=${{ matrix.threshold }}
          --cov-report=term --cov-report=xml:coverage-${{ matrix.service }}.xml
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: coverage-${{ matrix.service }}
          path: coverage-${{ matrix.service }}.xml
          retention-days: 14
