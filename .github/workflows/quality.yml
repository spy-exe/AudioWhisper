name: Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/web
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: Verify QA data isolation
        working-directory: .
        run: |
          docker compose -f docker-compose.e2e.yml config --format json > "$RUNNER_TEMP/qa-compose.json"
          python - "$RUNNER_TEMP/qa-compose.json" <<'PY'
          import json, sys
          config = json.load(open(sys.argv[1]))
          assert config['name'] == 'audiowhisper-qa'
          assert all(volume['name'].startswith('audiowhisper-qa_') for volume in config['volumes'].values())
          assert config['services']['gateway']['ports'][0]['published'] == '8090'
          assert config['services']['api']['environment']['ENVIRONMENT'] == 'e2e'
          assert config['services']['worker']['environment']['ENVIRONMENT'] == 'e2e'
          PY
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: coverage-web
          path: apps/web/coverage
          retention-days: 14

  windows-capture:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/capture/requirements*.txt
      - run: python -m pip install -r apps/capture/requirements-dev.txt
      - name: Tests and coverage
        run: >-
          python -m pytest apps/capture/tests -c apps/capture/pytest.ini
          --basetemp=${{ runner.temp }}/pytest-capture
          --cov=apps/capture/audiowhisper_capture --cov-fail-under=75
          --cov-report=term --cov-report=xml:coverage-capture.xml
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: coverage-windows-capture
          path: coverage-capture.xml
          retention-days: 14

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            coverage: '--cov=apps/api/app --cov=packages/core/src/audiowhisper_core'
            threshold: 95
          - service: worker
            coverage: '--cov=apps/worker/app'
            threshold: 90
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            apps/${{ matrix.service }}/requirements*.txt
            packages/core/pyproject.toml
      - name: System dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg libmagic1
      - name: Python dependencies
        run: python -m pip install -e packages/core -r apps/${{ matrix.service }}/requirements-dev.txt
      - name: Tests and coverage
        run: >-
          python -m pytest apps/${{ matrix.service }}/tests -c apps/${{ matrix.service }}/pytest.ini
          --basetemp=${{ runner.temp }}/pytest-${{ matrix.service }}
          ${{ matrix.coverage }} --cov-fail-under=${{ matrix.threshold }}
          --cov-report=term --cov-report=xml:coverage-${{ matrix.service }}.xml
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: coverage-${{ matrix.service }}
          path: coverage-${{ matrix.service }}.xml
          retention-days: 14
